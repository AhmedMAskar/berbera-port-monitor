name: S3-only VesselFinder scrape (Playwright)

on:
  schedule:
    - cron: "13 0,6,12,18 * * *"   # 00:13, 06:13, 12:13, 18:13 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Scrape VF -> normalize -> upload to S3
        env:
          S3_BUCKET:  ${{ secrets.S3_BUCKET }}        # berbera-port-monitor
          S3_PREFIX:  ${{ secrets.S3_PREFIX }}        # berbera
          AWS_REGION: ${{ secrets.AWS_REGION }}       # us-east-1
          VF_URL:     https://www.vesselfinder.com/ports/SOBBO001
        run: python scripts/s3_pipeline_shipfinder_berbera.py
      - name: Upload logs (optional)
        uses: actions/upload-artifact@v4
        with:
          name: vf-s3-playwright-run
          path: scripts/s3_pipeline_shipfinder_berbera.py
