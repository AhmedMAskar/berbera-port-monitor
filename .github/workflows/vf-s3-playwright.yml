name: S3-only VesselFinder scrape (Playwright)

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vf-s3-playwright
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET:  ${{ secrets.S3_BUCKET }}
      S3_PREFIX:  ${{ secrets.S3_PREFIX }}
      # optional debug toggles:
      DEBUG_SAVE_HTML_TO_S3: "1"
      ALLOW_EMPTY_UPLOAD: "0"  # fail if empty

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pip + Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run pipeline
        run: |
          set -euo pipefail
          python scripts/s3_pipeline_shipfinder_berbera.py
