name: S3-only VesselFinder scrape (Playwright)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Force scrape even if previous looked fresh"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write   # REQUIRED for OIDC

concurrency:
  group: vf-s3-playwright
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET:  ${{ secrets.S3_BUCKET }}
      S3_PREFIX:  ${{ secrets.S3_PREFIX }}
      DEBUG_SAVE_HTML_TO_S3: "1"
      ALLOW_EMPTY_UPLOAD: "0"                       # fail if scrape returns 0 rows
      FORCE_SCRAPE: ${{ github.event.inputs.force || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}   # e.g., arn:aws:iam::123456789012:role/GitHubOIDC-Berbera
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-berbera

      - name: Who am I?
        run: aws sts get-caller-identity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pip + Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run pipeline
        run: |
          set -euo pipefail
          python scripts/s3_pipeline_shipfinder_berbera.py
