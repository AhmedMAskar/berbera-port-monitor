name: Cleanup S3 latest
on: workflow_dispatch: {}
jobs:
  nuke:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Delete latest object
        run: |
          aws s3 rm "s3://${{ secrets.S3_BUCKET }}/${{ secrets.S3_PREFIX }}/latest/vf_snapshot.csv" || true
          echo "✅ Deleted latest. Re-run your vf-scrape workflow now."
